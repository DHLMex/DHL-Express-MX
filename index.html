<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXPRESS MXN | Rastreo</title>
<style>
:root{--red:#c8102e;--blue:#1976d2;--green:#2e7d32;--gray:#ccc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f2f2f2}
header{background:var(--red);color:#fff;padding:16px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.12);margin-bottom:14px}
input,textarea,select,button{width:100%;padding:12px;margin:8px 0;font-size:15px;border-radius:10px}
button{background:var(--red);color:#fff;border:none;cursor:pointer}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;background:#eee}
.progress-bar{display:flex;justify-content:space-between;margin:18px 0}
.progress-step{flex:1;text-align:center}
.progress-step::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--gray);display:block;margin:0 auto}
.progress-step.received::before{background:var(--green)}
.progress-step.active::before{background:var(--red)}
.timeline{border-left:3px solid var(--red);padding-left:14px}
.event{margin-bottom:12px}
.invoice{border:2px solid var(--red);padding:14px;border-radius:12px;margin-top:12px}
.admin{display:none;background:#fff3f3;border:1px solid #f1bcbc}
</style>
</head>
<body>
<header id="logo"><h2>EXPRESS MXN</h2></header>
<main>
<div class="card">
<h3>Rastrear envío</h3>
<input id="trackInput" placeholder="Número de guía" />
<button onclick="buscar()">Rastrear</button>
<div id="progress"></div>
<div id="resultado"></div>
</div>
<div class="card admin" id="adminPanel">
<h3>Panel Admin</h3>
<input id="aGuia" placeholder="Guía" />
<input id="aPedido" placeholder="Pedido" />
<input id="aCliente" placeholder="Cliente" />
<select id="aServicio"><option>Express</option><option>Estándar</option></select>
<input id="aOrigen" placeholder="Origen" />
<input id="aDestino" placeholder="Destino" />
<textarea id="aConceptos" placeholder="Conceptos factura"></textarea>
<textarea id="aEstados" placeholder="2026-01-12|Recibido\n2026-01-13|En tránsito\n2026-01-14|Entregado"></textarea>
<button onclick="guardar()">Guardar en la nube</button>
</div>
</main><!-- Firebase --><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script>
// 1️⃣ CONFIGURA ESTO CON TUS DATOS DE FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyB1oq9Bv-_FR1aaZqSMYEQt_1JGuQTTSqk",
  authDomain: "express-mxn.firebaseapp.com",
  projectId: "express-mxn",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 2️⃣ CLAVE ADMIN
const SECRET='MXN-ADMIN-2026';
document.getElementById('logo').ondblclick=()=>{
 const k=prompt('Clave admin');
 if(k===SECRET) adminPanel.style.display='block';
}

// 3️⃣ GUARDAR ENVÍO
async function guardar(){
 const guia=aGuia.value.trim();
 if(!guia) return alert('Guía requerida');
 await db.collection('envios').doc(guia).set({
  guia,
  pedido:aPedido.value,
  cliente:aCliente.value,
  servicio:aServicio.value,
  origen:aOrigen.value,
  destino:aDestino.value,
  conceptos:aConceptos.value,
  estados:aEstados.value.split('\n'),
  updated:Date.now()
 });
 alert('Guardado en la nube');
}

// 4️⃣ BUSCAR ENVÍO (FUNCIONA EN CUALQUIER CELULAR O PC)
async function buscar(){
 const guia=trackInput.value.trim();
 const doc=await db.collection('envios').doc(guia).get();
 if(!doc.exists) return resultado.innerHTML='No encontrado';
 mostrar(doc.data());
}

function mostrar(e){
 let p='<div class="progress-bar">';
 ['Recibido','En tránsito','Entregado'].forEach(s=>{
  let cls='';
  e.estados.forEach(x=>{if(x.includes(s)){cls=s==='Recibido'?'received':'active'}});
  p+=`<div class="progress-step ${cls}">${s}</div>`;
 });
 p+='</div>';
 progress.innerHTML=p;
 resultado.innerHTML=`
 <div class="badges">
 <span class="badge">📦 ${e.guia}</span>
 <span class="badge">👤 ${e.cliente}</span>
 <span class="badge">🚚 ${e.servicio}</span>
 </div>
 <div class="timeline">${e.estados.map(s=>`<div class="event">${s}</div>`).join('')}</div>
 <div class="invoice"><b>Factura</b><pre>${e.conceptos}</pre></div>`;} </script>

</body>
</html>
