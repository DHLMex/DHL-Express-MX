<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPRESS MXN | Rastreo y Factura Profesional</title>
<style>
:root{--red:#c8102e;--blue:#1976d2;--orange:#f57c00;--green:#2e7d32;--gray:#ccc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f2f2f2}
header{background:var(--red);color:#fff;padding:16px;position:relative}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.12);margin-bottom:14px}
input,textarea,select,button{width:100%;padding:12px;margin:8px 0;font-size:15px;border-radius:10px}
button{background:var(--red);color:#fff;border:none;cursor:pointer}
button.gray{background:#555}
button.link{background:#2e7d32}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;background:#eee}
.badge.guia{background:#fff3e0;color:#e65100}
.badge.service{background:#e3f2fd;color:#0d47a1}
.badge.order{background:#ede7f6;color:#4527a0}
.badge.client{background:#e8f5e9;color:#1b5e20}
.progress-bar{display:flex;justify-content:space-between;position:relative;margin:20px 0}
.progress-step{flex:1;text-align:center;position:relative}
.progress-step::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--gray);display:block;margin:0 auto;z-index:1;position:relative}
.progress-step.active::before{background:var(--red)}
.progress-step.received::before{background:var(--green)}
.progress-step::after{content:'';position:absolute;top:5px;left:50%;height:3px;background:var(--gray);width:100%;z-index:0}
.progress-step:first-child::after{left:50%;width:50%}
.progress-step:last-child::after{left:0;width:50%}
.progress-step.active::after{background:var(--red)}
.timeline{border-left:3px solid var(--red);padding-left:14px}
.event{margin-bottom:14px;position:relative;padding-left:8px}
.event::before{content:"📦";position:absolute;left:-32px;top:-2px;font-size:18px}
.en-transito p{color:var(--blue)}
.retrasado p{color:var(--orange)}
.delivered{background:#e8f8ee;border:1px solid #4caf50;padding:14px;border-radius:12px;margin-top:10px}
.admin{display:none;background:#fff3f3;border:1px solid #f1bcbc}
.invoice{border:2px solid #c8102e;padding:20px;border-radius:12px;background:#fff;position:relative;font-size:14px}
.invoice h2{text-align:center;margin-bottom:12px;color:var(--red)}
.invoice .section{border:1px dashed #ccc;padding:10px;margin:10px 0;border-radius:8px}
.invoice .section h3{margin:0 0 6px;font-size:14px;color:#333}
.invoice .row{display:flex;justify-content:space-between;margin:4px 0}
.invoice pre{background:#f5f5f5;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px}
@media print{header,button,.admin{display:none}}
</style>
</head>
<body>
<header id="logo">
<h1>EXPRESS MXN</h1>
<p id="subtitle">Servicios de Envío y Factura Profesional</p>
</header>
<main>
<div class="card">
<h2>Rastrear envío</h2>
<input id="trackInput" placeholder="Número de rastreo" />
<button onclick="buscar()" id="bTrack">Rastrear</button>
<div id="progressContainer"></div>
<div id="resultado"></div>
</div>
<div class="card admin" id="adminPanel">
<h2>Panel del Servidor</h2>
<input id="adminTrack" placeholder="Número de rastreo" />
<input id="adminOrder" placeholder="Número de pedido" />
<input id="adminClient" placeholder="Nombre del cliente" />
<select id="adminService"><option>Express</option><option>Estándar</option><option>Prioritario</option></select>
<input id="adminOrigen" placeholder="Origen" />
<input id="adminDestino" placeholder="Destino" />
<input id="adminDate" placeholder="Fecha de emisión" disabled />
<textarea id="adminConcepts" placeholder="Conceptos de la factura"></textarea>
<textarea id="adminStatus" placeholder="Fecha|Estado\n2026-01-12T09:00|Recibido\n2026-01-13T09:00|En tránsito\n2026-01-14T15:00|Entregado"></textarea>
<button onclick="guardar()">Guardar</button>
<button class="link" onclick="copiarLink()">Copiar link oculto</button>
</div>
</main>
<script>
const SECRET_KEY='MXN-ADMIN-2026';
logo.ondblclick=()=>{const k=prompt('Clave admin');if(k===SECRET_KEY){adminPanel.style.display='block';cargarFecha();}}
let envios=JSON.parse(localStorage.getItem('envios')||'{}');
function token(){return Math.random().toString(36).substring(2,12)}
function cargarFecha(){adminDate.value=new Date().toISOString().split('T')[0];}
function guardar(){
 const guia=adminTrack.value.trim(); if(!guia)return alert('Guía requerida');
 const tok=envios[guia]?.token||token();
 envios[guia]={guia,token:tok,order:adminOrder.value,client:adminClient.value,service:adminService.value,origen:adminOrigen.value,destino:adminDestino.value,date:adminDate.value,invoice:adminConcepts.value,estados:adminStatus.value.split('\n')};
 localStorage.setItem('envios',JSON.stringify(envios)); mostrar(envios[guia]); alert('Guardado');
}
function copiarLink(){const guia=adminTrack.value.trim();if(!envios[guia])return alert('Guarda primero');const url=location.origin+location.pathname+'?token='+envios[guia].token;navigator.clipboard.writeText(url);alert('Link copiado');}
function buscar(){const guia=trackInput.value.trim();mostrar(envios[guia]);}
function mostrar(e){if(!e)return;
 const steps=['Recibido','En tránsito','Entregado'];
 let now=new Date();
 let progressHtml='<div class="progress-bar">';
 steps.forEach((s,i)=>{let cls=''; e.estados.forEach(st=>{const [d,estado]=st.split('|'); if(estado===s && s==='Recibido') cls='received'; if(estado===s && s!=='Recibido' && new Date(d)<=now) cls='active';}); progressHtml+=`<div class="progress-step ${cls}"><span>${s}</span></div>`;});
 progressHtml+='</div>';
 progressContainer.innerHTML=progressHtml;
 let html=`<div class="badges">
<span class="badge guia">📦 Guía: <b>${e.guia}</b></span>
<span class="badge service">🚚 ${e.service}</span>
<span class="badge order">🧾 Pedido: ${e.order||'-'}</span>
<span class="badge client">👤 ${e.client||'-'}</span>
</div>`;
 html+='<div class="timeline">'; e.estados.forEach(x=>{const[p,s]=x.split('|');if(new Date(p)<=now){html+=`<div class="event"><p>${s}</p></div>`}});
 html+='</div>';
 html+=`<div class="invoice">
<h2>Factura EXPRESS MXN</h2>
<div class="section"><h3>Datos del Envío</h3>
<div class="row"><span>Guía:</span><span>${e.guia}</span></div>
<div class="row"><span>Pedido:</span><span>${e.order}</span></div>
<div class="row"><span>Cliente:</span><span>${e.client}</span></div>
<div class="row"><span>Servicio:</span><span>${e.service}</span></div>
<div class="row"><span>Origen:</span><span>${e.origen}</span></div>
<div class="row"><span>Destino:</span><span>${e.destino}</span></div>
<div class="row"><span>Fecha de emisión:</span><span>${e.date}</span></div></div>
<div class="section"><h3>Factura / Conceptos</h3><pre>${e.invoice}</pre></div></div>`;
 resultado.innerHTML=html;
}
const params=new URLSearchParams(location.search);
if(params.get('token')){const e=Object.values(envios).find(x=>x.token===params.get('token'));if(e) mostrar(e);}
</script>
</body>
</html>
